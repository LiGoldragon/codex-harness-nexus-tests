[package]
name = "codex-harness-nexus-tests"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LiGoldragon/codex-harness-nexus-tests"
publish = false

[dependencies]
harness = { package = "harness-nexus-library", git = "https://github.com/LiGoldragon/harness-nexus-library", rev = "3613d63d0994de7841bcf6f070c83bebb0ddfa5a", default-features = false }
flow = { package = "flow-ethos", git = "https://github.com/LiGoldragon/flow", rev = "062ef9e1", default-features = false }
codex-harness-nexus = { git = "https://github.com/LiGoldragon/codex-harness-nexus", rev = "2840443ae34c38c6eff1fc3b4d7e0722a741846d" }
codex-harness-translator = { git = "https://github.com/LiGoldragon/codex-harness-nexus", rev = "2840443ae34c38c6eff1fc3b4d7e0722a741846d", features = ["text"] }
signal = { git = "https://github.com/LiGoldragon/signal", rev = "4f5cbb9", default-features = false }
signal-codex-harness-nexus = { git = "https://github.com/LiGoldragon/signal-codex-harness-nexus", rev = "68dafec69a6f733cbee74a7a990b9aeffd0c4873", default-features = false, features = ["datom"] }
meta-signal-codex-harness-nexus = { git = "https://github.com/LiGoldragon/meta-signal-codex-harness-nexus", rev = "b6039b70491a2b4b778af4b094c3b5782da2964e", default-features = false, features = ["datom"] }
nexus-exchange = { git = "https://github.com/LiGoldragon/nexus", rev = "a4bc0113c10c34ec9d92cde2d650eca9324144db", default-features = false }
shared-translator = { package = "translator", git = "https://github.com/LiGoldragon/translator", rev = "29601a3", default-features = false, features = ["text", "unix"] }
translator-client = { git = "https://github.com/LiGoldragon/translator", rev = "2739d586e1455a001661fc85a8a61b6219aa99df", default-features = false, features = ["datom"] }
translator-serving = { git = "https://github.com/LiGoldragon/translator", rev = "2739d586e1455a001661fc85a8a61b6219aa99df", default-features = false, features = ["text"] }
notify = "8.2.0"
nix = { version = "0.30", features = ["signal"] }
tokio = { version = "1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "signal", "sync", "time", "tracing"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await-macro", "channel", "io", "sink"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
dead_code = "warn"
